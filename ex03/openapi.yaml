openapi: 3.1.0
info:
  title: 부서 헬프데스크 API
  version: 1.0.0
paths:
  /api/tickets:
    get:
      summary: 요청 목록 (P1 → P4 순)
      responses:
        "200":
          description: 요청 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      summary: 요청 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        "201":
          description: 만든 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "422":
          description: 제목을 입력하세요
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/tickets/{id}/assign:
    post:
      summary: 나에게 배정
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 바뀐 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: 요청을 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: open 상태만 배정할 수 있습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 요청 번호가 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Ticket:
      type: object
      required: [id, title, category, priority, status, assignee]
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
        category:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 4
        status:
          type: string
          enum: [open, assigned, resolved]
        assignee:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 오류 코드
        message:
          type: string
          description: 화면에 보일 글자
